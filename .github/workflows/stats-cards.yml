name: Generate Stats Cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Clone github-readme-stats
        run: |
          git clone --depth 1 https://github.com/anuraghazra/github-readme-stats.git "$RUNNER_TEMP/grs"
          cd "$RUNNER_TEMP/grs"
          npm install --omit=dev

      - name: Generate cards
        env:
          GRS_DIR: ${{ runner.temp }}/grs
          GH_USERNAME: ${{ github.repository_owner }}
          PAT_1: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}
        run: node .github/scripts/generate-cards.mjs

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats/
          git diff --cached --quiet || (git commit -m "chore: update stats cards" && git push)
